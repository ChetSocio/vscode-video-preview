name: CI

on:
  pull_request:
  push:
    branches:
      - feature/v03-streaming-player

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: node --check media/videoEditor.js
